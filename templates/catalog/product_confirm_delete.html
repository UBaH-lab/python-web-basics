{% extends 'base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<h1 class="mb-4">Удалить товар</h1>

<div class="card">
    <div class="card-body">
        <p class="card-text">Вы уверены, что хотите удалить товар <strong>{{ object.name }}</strong>?</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
